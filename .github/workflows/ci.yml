name: CI/CD

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: "temurin"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────
  # 1) BUILD + TESTES + COBERTURA
  # ────────────────────────────────────────────────────────────
  test:
    name: 🧪 Build, testes e cobertura
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: nhac_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: 🔍 Validar POM
        run: mvn -B validate

      - name: 🏗️ Compilar
        run: mvn -B -ntp clean compile

      - name: ✅ Rodar testes + gerar cobertura
        env:
          DB_URL: jdbc:mariadb://localhost:3306/nhac_db
          DB_USER: root
          DB_PASS: ci_root_password
          JWT_SENHA: ci_test_secret_key_not_for_production
        run: mvn -B -ntp verify

      - name: 📊 Publicar resultado dos testes
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "target/surefire-reports/TEST-*.xml"
          check_name: "Resultado dos testes"
          fail_on_failure: true
          require_tests: true

      - name: 📦 Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7
  # ────────────────────────────────────────────────────────────
  # 2) SMOKE TEST — 61 ENDPOINTS + COBERTURA OPENAPI
  # ────────────────────────────────────────────────────────────
  smoke:
    name: 🚦 Smoke test (61 endpoints)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: nhac_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: 📦 Baixar JAR do job "test"
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: 🚀 Subir backend em background
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_URL: jdbc:mariadb://localhost:3306/nhac_db
          DB_USER: root
          DB_PASS: ci_root_password
          JWT_SENHA: ci_test_secret_key_not_for_production
        run: |
          JAR=$(ls target/*.jar | head -n 1)
          echo "Rodando: $JAR"
          nohup java -jar "$JAR" > backend.log 2>&1 &
          echo $! > backend.pid
          echo "Backend PID: $(cat backend.pid)"

      - name: ⏳ Aguardar backend (até 90s)
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080/v3/api-docs > /dev/null 2>&1; then
              echo "✅ Backend pronto após ${i} tentativas"
              exit 0
            fi
            echo "⏳ Tentativa ${i}/45..."
            sleep 2
          done
          echo "❌ Backend não respondeu em 90s"
          tail -n 100 backend.log
          exit 1

      - name: 🔧 Permissão de execução nos scripts
        run: |
          chmod +x scripts/smoke-test.sh || true
          chmod +x scripts/cobertura-smoke.sh || true

      - name: 🧪 Rodar smoke test
        id: smoke
        continue-on-error: true
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: ./scripts/smoke-test.sh

      - name: 📊 Rodar cobertura vs OpenAPI
        id: coverage
        if: always()
        continue-on-error: true
        run: ./scripts/cobertura-smoke.sh || true

      - name: 📦 Upload do log do backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-log
          path: backend.log
          retention-days: 7

      - name: 🛑 Matar backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) 2>/dev/null || true
          fi

      - name: ❌ Falhar se smoke não passou
        if: steps.smoke.outcome == 'failure'
        run: exit 1

  # ────────────────────────────────────────────────────────────
  # 3) SCAN DE DEPENDÊNCIAS
  # ────────────────────────────────────────────────────────────
  security-deps:
    name: 🔒 Scan de dependências
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Trivy — scan do filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: 📤 Upload resultado
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-dependencies

  # ────────────────────────────────────────────────────────────
  # 4) BUILD & PUBLISH DOCKER
  # ────────────────────────────────────────────────────────────
  docker:
    name: 🐳 Build & Publish Docker
    runs-on: ubuntu-latest
    needs: [test, smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🏷️ Metadata/tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=${{ github.run_number }}

      - name: 🔧 Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────
  # 5) SCAN DA IMAGEM
  # ────────────────────────────────────────────────────────────
  security-image:
    name: 🔒 Scan da imagem Docker
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 🔍 Trivy — scan da imagem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.image-digest }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: 📤 Upload resultado
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image
  # ────────────────────────────────────────────────────────────
  # 6) NOTIFICAÇÃO
  # ────────────────────────────────────────────────────────────
  notify:
    name: 📣 Notificar resultado
    runs-on: ubuntu-latest
    needs: [test, smoke, security-deps, docker, security-image]
    if: always() && github.event_name == 'push'
    steps:
      - name: 📣 Discord
        if: ${{ vars.DISCORD_WEBHOOK_CONFIGURED == 'true' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.test.result == 'success' && needs.smoke.result == 'success' && 'success' || 'failure' }}
          title: "CI/CD — backend_nhac"
          description: |
            Branch: `${{ github.ref_name }}`
            Commit: `${{ github.sha }}`
            Autor: ${{ github.actor }}

            **Testes:** ${{ needs.test.result }}
            **Smoke:** ${{ needs.smoke.result }}
          color: ${{ needs.test.result == 'success' && needs.smoke.result == 'success' && '0x57F287' || '0xED4245' }}
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"


