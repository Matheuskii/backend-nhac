spring.application.name=backend_nhac


spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/nhac_db?serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:senai}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
api.security.token.secret=${JWT_SENHA:minha_chave_secreta_local_muito_segura_12345}
spring.jpa.show-sql=true
spring.flyway.out-of-order=true
google.client.id=${CLIENT_GOOGLE_ID:google_cloud_client_id}
twilio.account-sid=${TWILIO_SID:seu_twilio_sid}
twilio.auth-token=${AUTH_TOKEN:seu_twilio_auth_token}
twilio.from-number=${NUMBER:numero}
nhac.sms.mock-mode=true

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY:sk_test_12345}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_12345}

# Asaas API Configuration (para PIX)
asaas.api.key=${ASAAS_API_KEY:seu_asaas_api_key_aqui}
asaas.api.url=${ASAAS_API_URL:https://sandbox.asaas.com/api/v3}
asaas.webhook.token=${ASAAS_WEBHOOK_TOKEN:seu_token_inventado}

logging.level.br.com.nhac.backend_nhac.domain.auth.TwilioSmsService=INFO

spring.profiles.active=dev
# Brevo (E-mail Transacional)
brevo.api-key=${BREVO_API_KEY:sua_chave_api}
brevo.api-base-url=${BREVO_BASE_URL:https://api.brevo.com/v3}
brevo.sender-email=${BREVO_SENDER_EMAIL:teu_email@gmail.com}
brevo.sender-name=${BREVO_SENDER_NAME:Nhac Delivery}
brevo.timeout-seconds=15
nhac.email.mock-mode=false
spring.flyway.validate-on-migrate=false

# Firebase Storage (upload de imagens de loja e produtos)
# Em mock-mode (padrão), o upload não sobe nada de verdade: só loga e devolve uma URL de placeholder.
# Para ligar de verdade: configure FIREBASE_STORAGE_BUCKET e FIREBASE_CREDENTIALS_BASE64
# (o JSON da service account em Base64) e defina NHAC_STORAGE_MOCK_MODE=false.
firebase.storage.bucket-name=${FIREBASE_STORAGE_BUCKET:}
firebase.storage.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}
nhac.storage.mock-mode=${NHAC_STORAGE_MOCK_MODE:true}
nhac.storage.max-tamanho-bytes=5242880
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
